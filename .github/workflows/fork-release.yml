name: Fork release

# Builds every push to main of this fork for macOS on Apple silicon and
# publishes it as a GitHub release. The upstream release workflow
# (release.yml) stays as it is: it runs on v* tags and needs the
# maintainer's signing secrets, so the tags made here start with "fork-"
# and never match it.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a build still running for an older one.
concurrency:
  group: fork-release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Optional: without the secret the build ships keyless and the GIF
  # picker asks for a key.
  ZAPFAST_GIPHY_KEY: ${{ secrets.ZAPFAST_GIPHY_KEY }}

jobs:
  version:
    name: release name
    if: github.repository != 'crmne/zapfast'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=fork-v$version-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS arm64 app
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      # rust-toolchain.toml pins the compiler; add the target to that one.
      - run: rustup target add aarch64-apple-darwin
      - run: cargo build --locked --release --target aarch64-apple-darwin
      # Ad-hoc signed only (no Apple credentials): the first launch needs
      # right-click > Open, or `xattr -dr com.apple.quarantine ZapFast.app`.
      - name: App bundle
        run: |
          name="zapfast-${{ needs.version.outputs.tag }}-macos-arm64"
          mkdir -p dist
          bash packaging/macos/bundle.sh target/aarch64-apple-darwin/release/zapfast dist/ZapFast.app "${{ needs.version.outputs.version }}"
          ditto -c -k --keepParent dist/ZapFast.app "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [version, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ZapFast ${{ needs.version.outputs.version }} (fork build ${{ github.run_number }})
          body: |
            Automatic build of ${{ github.sha }} from this fork's main.

            macOS: the app is not notarized; open it the first time with right-click > Open.
          files: dist/*
          make_latest: true
